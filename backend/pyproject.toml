[project]
name = "threat-hunting-workbench"
version = "1.0.0-dev"
description = "Local DFIR and Threat Hunting Platform"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    
    # Database
    "aiosqlite>=0.20.0",
    
    # Parsers
    "python-evtx>=0.7.4",
    "dissect.regf>=3.6",
    "dissect.util>=3.15",
    "yara-python>=4.5.0",
    
    # Data Processing
    "pydantic>=2.9.0",
    "orjson>=3.10.0",
    
    # Reporting
    "jinja2>=3.1.4",
    "weasyprint>=62.0",
    
    # Utilities
    "python-dateutil>=2.9.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
